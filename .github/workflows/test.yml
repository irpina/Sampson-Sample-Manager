name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The tested modules are dependency-free (pywebview/pydub/pygame are
      # only imported by the app shell or lazily), so pytest is all we need.
      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -v
